# ==================================================================
# OpenDKIM — подпись исходящих и проверка входящих DKIM-подписей
# (milter для Postfix). man opendkim.conf(5)
#
# Обновлено 2026-10: исправлены ошибки и конфиг приведён к
# актуальным рекомендациям (Ubuntu 24.04, opendkim 2.11).
# ==================================================================

# --- Логирование ----------------------------------------------------
Syslog                  yes
SyslogSuccess           yes
LogWhy                  yes

# --- Надёжность -----------------------------------------------------
AutoRestart             yes
AutoRestartRate         10/1h

# --- Права ----------------------------------------------------------
# ИСПРАВЛЕНО: было "UMask 002" — сокет/файлы получали групповую запись,
# что лишнее и нестандартно. 007 — каноническое значение Debian/Ubuntu.
UMask                   007
UserID                  opendkim:opendkim
PidFile                 /run/opendkim/opendkim.pid

# --- Криптография ---------------------------------------------------
# rsa-sha1 запрещён RFC 8301 — только rsa-sha256. (Корректно и раньше.)
SignatureAlgorithm      rsa-sha256

# ИСПРАВЛЕНО: было "relaxed/simple". simple-каноникализация тела
# ломается при пересылке через списки рассылки и форвардеры.
# relaxed/relaxed — текущая рекомендация (RFC 6376, M3AAWG).
Canonicalization        relaxed/relaxed

# ДОБАВЛЕНО: защита от DKIM-replay — заголовок From: подписывается
# «с запасом» (oversigning), чтобы подпись нельзя было переиспользовать
# в письме с другим содержимым (RFC 6376 §8.6; рекомендовано с 2019).
OversignHeaders         From

# --- Таблицы ключей/подписи (файлы перечитываются на каждое письмо) -
InternalHosts           refile:/etc/opendkim/TrustedHosts
ExternalIgnoreList      refile:/etc/opendkim/TrustedHosts
KeyTable                refile:/etc/opendkim/KeyTable
SigningTable            refile:/etc/opendkim/SigningTable

# --- Режим ------------------------------------------------------------
# sv = подпись (s) + проверка (v). Проверка нужна OpenDMARC — он читает
# результаты DKIM из заголовка Authentication-Results.
Mode                    sv
# При переподписании удалять уже существующие подписи (для релея ОК).
RemoveOldSignatures     yes

# --- Транспорт --------------------------------------------------------
# TCP-сокет — единственный надёжный вариант, т.к. smtpd Postfix в
# Debian/Ubuntu работает в chroot (/var/spool/postfix) и unix-сокет
# из /run опендкима не увидит.
# Должно совпадать с:
#   - SOCKET=inet:8891@localhost в /etc/default/opendkim
#   - smtpd_milters = inet:localhost:8891 в /etc/postfix/main.cf
Socket                  inet:8891@localhost

# --- Заголовки, исключаемые из подписи --------------------------------
# ИСПРАВЛЕНО: старая строка оканчивалась мусором "<Paste>" — артефакт
# копипасты; opendkim ругался на несуществующий заголовок.
# Также убраны Date и Message-ID: их исключение ОСЛАБЛЯЕТ подпись
# (упрощает replay), а с OversignHeaders From не требуется.
OmitHeaders             Bcc, Resent-Bcc

# --- Ключи -------------------------------------------------------------
# Генерация (длина 2048 бит! ключи 1024 бит считаются слабыми с 2018):
#   opendkim-genkey -b 2048 -d mymyblog.cf -D /etc/opendkim/keys/mymyblog.cf -s mail -v
#   chown opendkim:opendkim /etc/opendkim/keys/mymyblog.cf/mail.private
#   chmod 600 /etc/opendkim/keys/mymyblog.cf/mail.private
# Селектор (mail) рекомендуется ротировать 1–2 раза в год.
