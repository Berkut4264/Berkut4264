# Dovecot — аутентификация (10-auth.conf)
# Виртуальные пользователи (как на исходном сервере: vmail-ящики Postfix).

# Plain-логины без TLS запрещены (для IPv4-mynetworks исключений нет).
# В Dovecot 2.4 этот параметр заменён зеркальным: auth_allow_cleartext = no
disable_plaintext_auth = yes

auth_mechanisms = plain login
# Опционально добавьте scram-sha-256, но тогда пароли в /etc/dovecot/passwd
# должны храниться в схеме SCRAM-SHA-256 (doveadm pw -s SCRAM-SHA-256).

# --- passdb: пароли хранятся в файле (создаётся doveadm pw) ----------
# Формат файла /etc/dovecot/passwd:  user@domain:{SCHEME}hash::::::
# Создание:  doveadm pw -s SHA512-CRYPT
# Также валиден файл /etc/dovecot/userdb из старого сервера — перенесите
# его содержимое в /etc/dovecot/passwd (единый формат passwd-file).
passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /etc/dovecot/passwd
}

# --- userdb: статически один системный пользователь vmail -------------
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

# !include auth-system.conf.ext   # локальным юзерам IMAP не нужен — не подключаем
