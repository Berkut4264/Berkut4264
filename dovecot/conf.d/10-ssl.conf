# Dovecot — TLS (10-ssl.conf)
#
# Модернизировано 2026-10. УСТАРЕВШЕЕ из руководств эпохи 2.2/2.3.0:
#   ssl_protocols = !SSLv3 !TLSv1 !TLSv1.1   -> ssl_min_protocol (с 2.3)
#   ssl = yes + disable_plaintext_auth       -> ssl = required ниже
#   ssl_cert_username_field / ssl_parameters_regenerate — удалены из 2.3

ssl = required

# Let's Encrypt (санкции: сертификат должен включать имя mail.mymyblog.cf!)
ssl_cert = </etc/letsencrypt/live/mail.mymyblog.cf/fullchain.pem
ssl_key  = </etc/letsencrypt/live/mail.mymyblog.cf/privkey.pem

# TLS 1.2+ (TLS 1.0/1.1 запрещены RFC 8996; TLS 1.3 поддерживается)
ssl_min_protocol = TLSv1.2

ssl_prefer_server_ciphers = yes
ssl_cipher_list = EECDH+AESGCM:EDH+AESGCM

# DH-параметры (файл существовал на исходном сервере — dovecot/dh.pem;
# в metadata 0644 — БЫЛО НЕБЕЗОПАСНО видно всем, но это не секрет; можно
# было оставить). Генерация:  openssl dhparam -out /etc/dovecot/dh.pem 2048
ssl_dh = </etc/dovecot/dh.pem

# ----------------------------------------------------------------------
# ВНИМАНИЕ — Dovecot 2.4 (Debian 13+, будущие Ubuntu): имена изменились:
#   ssl_cert  -> ssl_server_cert_file   (значение — путь, БЕЗ префикса '<')
#   ssl_key   -> ssl_server_key_file
#   ssl_ca    -> ssl_server_ca_file
#   ssl_dh    -> ssl_server_dh_file
#   ssl_prefer_server_ciphers -> ssl_server_prefer_ciphers
#   disable_plaintext_auth=yes -> auth_allow_cleartext=no
# ssl_min_protocol, ssl_cipher_list — без изменений.
# Руководство: https://doc.dovecot.org/main/installation/upgrade/2.3-to-2.4.html
