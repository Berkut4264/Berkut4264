# Dovecot — службы и сокеты (10-master.conf)

# --- IMAP -----------------------------------------------------------
service imap-login {
  inet_listener imap {
    port = 143        # STARTTLS; ssl=required не даст войти без TLS
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# service pop3-login — отсутствует: POP3 выключен (protocols без pop3),
# как и на исходном сервере (pop3d.protocol.disab в metadata).

# --- LMTP: доставка от Postfix --------------------------------------
service lmtp {
  # chroot-нутый postfix видит сокет только внутри /var/spool/postfix
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode  = 0600
    user  = postfix
    group = postfix
  }
}

# --- Auth: SASL для Postfix ------------------------------------------
service auth {
  # Postfix (smtpd_sasl_path = private/auth) — тоже внутри chroot
  unix_listener /var/spool/postfix/private/auth {
    mode  = 0660
    user  = postfix
    group = postfix
  }
  unix_listener auth-userdb {
    mode = 0600
    user = vmail
  }
}

service auth-worker {
}

# --- Права сокета конфигурации (doveadm) ------------------------------
service config {
  unix_listener config {
  }
}
