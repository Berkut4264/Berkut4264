# Dovecot — хранилище почты (10-mail.conf)

# maildir в домашнем каталоге виртуального пользователя
# (home берётся из userdb: /var/mail/vhosts/%d/%n)
mail_location = maildir:~/Maildir

namespace inbox {
  inbox = yes
}

# Почту читает/пишет только vmail (см. 10-auth.conf, static userdb)
first_valid_uid = 5000
last_valid_uid  = 5000
first_valid_gid = 5000
last_valid_gid  = 5000

mail_privileged_group = mail

# Атрибуты файлов Maildir
mail_access_groups =
lock_method = fcntl
mmap_disable = no
