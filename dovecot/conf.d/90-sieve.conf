# Dovecot — Sieve (90-sieve.conf), пакеты dovecot-sieve + dovecot-managesieved

protocol sieve {
  # ManageSieve в Debian 12+/Ubuntu 24.04 слушает 4190/tcp по умолчанию
  # (старый порт 2000 признан устаревшим ещё в 2010)
}

plugin {
  sieve = file:~/sieve;active=~/.dovecot.sieve

  # Глобальный сценарий по умолчанию (создайте каталог при необходимости):
  # sieve_before = /var/lib/dovecot/sieve/default.sieve

  # Спам, помеченный Amavis/SpamAssassin (заголовок X-Spam-Flag: YES),
  # складывайте глобальным sieve-правилом в Junk:
  #   require "fileinto";
  #   if header :contains "X-Spam-Flag" "YES" { fileinto "Junk"; stop; }
}
