# ==================================================================
# Dovecot — главный файл (IMAP + LMTP + ManageSieve; POP3 отключён,
# как и на исходном сервере: protocols.d/pop3d.protocol.disab)
#
# Восстановлен и модернизирован 2026-10. Синтаксис: Dovecot 2.3.x
# (Ubuntu 24.04 = dovecot 2.3.21). Различия с Dovecot 2.4 — см.
# комментарий в conf.d/10-ssl.conf и MAIL-AUDIT.md.
# Проверка:  doveconf -n && systemctl reload dovecot
# ==================================================================

## Если не нужно явно управлять протоколами, раскомментируйте include:
# !include_try /usr/share/dovecot/protocols.d/*.protocol
protocols = imap lmtp sieve

dict {
}

!include conf.d/*.conf
!include_try local.conf
