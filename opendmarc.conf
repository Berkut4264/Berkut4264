# ==================================================================
# OpenDMARC — проверка DMARC для входящей почты (milter для Postfix)
# man opendmarc.conf(5)
#
# Обновлено 2026-10: исправлены несостыковки, конфиг приведён к
# рекомендациям OpenDMARC >= 1.4 (Ubuntu 24.04: opendmarc 1.4.2).
# ==================================================================

Syslog                  true
SyslogFacility          mail

# --- Идентификатор службы ---------------------------------------------
# AuthservID попадает в заголовок Authentication-Results.
# КЛЮЧЕВАЯ ОШИБКА в старой конфигурации:
#   TrustedAuthservIDs mymyblog.cf
# не совпадало с authserv-id, который проставляет сам сервер (имя хоста,
# т.е. "mail"/"mail.mymyblog.cf"). Последствия:
#   1) своим же Authentication-Results (от OpenDKIM) OpenDMARC не
#      доверял — DKIM/SPF-результаты игнорировались;
#   2) доверие распространялось на поддельные заголовки с чужого домена.
# Значение должно совпадать с AuthservID. HOSTNAME подставляет имя хоста.
AuthservID              HOSTNAME
TrustedAuthservIDs      HOSTNAME

PidFile                 /run/opendmarc/opendmarc.pid
UserID                  opendmarc
UMask                   0002

# ИСПРАВЛЕНО: было "PublicSuffixList /usr/share/publicsuffix" — это
# КАТАЛОГ, а нужен файл со списком публичных суффиксов (пакет publicsuffix).
PublicSuffixList        /usr/share/publicsuffix/public_suffix_list.dat

# --- Транспорт --------------------------------------------------------
# ИСПРАВЛЕНО: было "Socket local:/var/run/opendmarc/opendmarc.sock".
# smtpd Postfix в Ubuntu работает в chroot и unix-сокет вне
# /var/spool/postfix недоступен. TCP — надёжно и просто.
# Должно совпадать с /etc/default/opendmarc и smtpd_milters в main.cf.
Socket                  inet:8893@localhost

# Клиенты, прошедшие SASL-аутентификацию (submission), DMARC не проверяем.
IgnoreAuthenticatedClients true
IgnoreHosts             /etc/opendmarc/ignore.hosts

# --- SPF --------------------------------------------------------------
# OpenDMARC >= 1.4: самостоятельно проверять SPF, а не доверять чужим
# заголовкам Authentication-Results/Received-SPF. Рекомендуется.
SPFIgnoreResults        true
SPFSelfValidate         true

# --- Политика -----------------------------------------------------------
# Отклонять письма, провалившие DMARC-оценку согласно опубликованной
# политике домена отправителя (p=quarantine/reject) — современная
# рекомендация. При первичном запуске можно временно поставить false
# и понаблюдать за логами (mail.log), затем включить.
RejectFailures          true

# --- Отчётность -------------------------------------------------------
# История для агрегированных отчётов (opendmarc-reports / MySQL через
# dbconfig-common). Каталог /run/opendmarc создаётся systemd
# (RuntimeDirectory) или init-скриптом.
HistoryFile             /run/opendmarc/opendmarc.dat
# FailureReports true — отправлять forensic-отчёты (RFC 6591); включать
# осознанно: возможна утечка содержимого писем в отчётах.
