# postfix-policyd-spf-python — проверка SPF входящей почты.
# Восстановлено 2026-10 (в репозитории присутствовало только имя файла).
# Вызывается из postfix: check_policy_service unix:private/policyd-spf

# 1 = только логирование решений; 0 = тишина
debugLevel = 1

# 1 = тестовый режим: ничего не отклонять, только писать в лог.
# После проверки логов поставьте 0!
TestOnly = 1

# Политика по результатам HELO-проверки:
#   SPF_Not_Pass -> 550 (Fail/Softfail/None), Fail -> отклонять только Fail
HELO_reject = SPF_Not_Pass

# Политика по Mail From:
#   Fail -> 550 только при "-all" (жёсткий fail);
#   Softfail -> и 550 при "~all" (мягкий fail — только когда уверены)
Mail_From_reject = Fail

# DNS-ошибки не должны ломать почту:
PermError_reject = False
TempError_Defer = False

# Свои сети SPF-проверке не подлежат:
skip_addresses = 127.0.0.0/8,::ffff:127.0.0.0/104,::1
